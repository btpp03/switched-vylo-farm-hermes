name: farm-cloud-tokens

# Manual trigger only: farms switched.cloud Cloud Tokens through the Vylo route and
# optionally spends the whole balance as VPS runtime.
#
# vylo.cc refuses datacenter IPs, so a residential exit is required. Two ways:
#   * secret PROXY        -> socks5://host:port or http://host:port (ready-made proxy)
#   * secret SB_CONFIG    -> a sing-box config with local socks inbounds (10801-10808);
#                            the job starts sing-box itself and uses socks5://127.0.0.1:10807
on:
  workflow_dispatch:
    inputs:
      count:
        description: "how many tokens to farm (daily cap is 25)"
        default: "25"
        required: true
      spend:
        description: "spend all tokens as runtime afterwards (默认不换，token 留在余额里)"
        type: boolean
        default: false
      proxy:
        description: "override proxy URL (empty = use PROXY secret or local sing-box)"
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: farm-cloud-tokens
  cancel-in-progress: false

jobs:
  farm:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start residential exit (only if SB_CONFIG secret is set)
        env:
          SB_CONFIG: ${{ secrets.SB_CONFIG }}
        run: |
          if [ -z "$SB_CONFIG" ]; then
            echo "no SB_CONFIG secret - skipping local sing-box"
            exit 0
          fi
          VER=1.14.1
          curl -sSLo sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-linux-amd64.tar.gz"
          tar xzf sb.tgz
          cp "sing-box-${VER}-linux-amd64/sing-box" ./sing-box
          printf '%s' "$SB_CONFIG" > sb.json
          nohup ./sing-box run -c sb.json > sb.log 2>&1 &
          for i in $(seq 25); do
            ip=$(curl -s -m 6 --socks5-hostname 127.0.0.1:10807 https://api.ipify.org || true)
            if [ -n "$ip" ]; then echo "residential exit ip: $ip"; break; fi
            sleep 3
          done
          tail -3 sb.log || true

      - name: Install playwright
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Farm
        env:
          NOPROFIT_COOKIES: ${{ secrets.NOPROFIT_COOKIES }}
          INPUT_PROXY: ${{ github.event.inputs.proxy }}
          SECRET_PROXY: ${{ secrets.PROXY }}
          COUNT: ${{ github.event.inputs.count }}
        run: |
          set -o pipefail
          export SW_PROXY="${INPUT_PROXY:-${SECRET_PROXY:-socks5://127.0.0.1:10807}}"
          echo "proxy: ${SW_PROXY%%@*}"
          xvfb-run -a -s "-screen 0 1400x1000x24" python3 -u vylo_farm.py --count "$COUNT" 2>&1 | tee farm.log
          grep SUMMARY farm.log || true

      - name: Upload logs on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: farm-debug
          path: |
            farm.log
            sb.log
            /tmp/vylo_turnstile_fail_*.png
          if-no-files-found: ignore

      - name: Spend tokens as runtime
        if: ${{ github.event.inputs.spend == 'true' }}
        env:
          NOPROFIT_COOKIES: ${{ secrets.NOPROFIT_COOKIES }}
          INPUT_PROXY: ${{ github.event.inputs.proxy }}
          SECRET_PROXY: ${{ secrets.PROXY }}
        run: |
          export SW_PROXY="${INPUT_PROXY:-${SECRET_PROXY:-socks5://127.0.0.1:10807}}"
          xvfb-run -a python3 -u add_runtime.py --tokens 0
